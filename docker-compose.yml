services:
  postgres:
    image: postgres:16-alpine
    container_name: donghaeng-postgres
    environment:
      POSTGRES_USER: donghaeng
      POSTGRES_PASSWORD: donghaeng
      POSTGRES_DB: donghaeng
    ports:
      - "5433:5432"   # host 5432 is taken by a native postgres on this machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donghaeng -d donghaeng"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: donghaeng-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  minio_data:
